# Copied from za6_hardware/config/hal_402_device_mgr.yaml
hal_402_device_mgr:
  ethercat_drive_params_group:  joints
  drives:
      drive_1:
        instance: 1
        slave_number: 0
        hal_name: lcec.0.0
        type: inovance_is620n
      drive_2:
        instance: 2
        slave_number: 1
        hal_name: lcec.0.1
        type: inovance_is620n
      drive_3:
        instance: 3
        slave_number: 2
        hal_name: lcec.0.2
        type: inovance_is620n
      drive_4:
        instance: 4
        slave_number: 3
        hal_name: lcec.0.3
        type: inovance_is620n
      drive_5:
        instance: 5
        slave_number: 4
        hal_name: lcec.0.4
        type: inovance_is620n
      drive_6:
        instance: 6
        slave_number: 5
        hal_name: lcec.0.5
        type: inovance_is620n


ethercat_drive_params:
  # Joint drives:  Inovance SV660N
  joints:
    device_description_xml:
      # - See launch/hal_hardware.launch
      ros_package:  za6_hardware
      path:  config/SV660_EOE_1Axis_V9.12.xml

    device_id:
      vendor_id:  0x00100000
      product_code:  0x000C010D

    # Ethercat master and positions this configuration applies to
    master: 0
    positions: [0, 1, 2, 3, 4, 5]

    # Parameter settings
    param_values:
      # *** Servo Motor Parameters ***
      #
      # Motor code:
      # 14101:  Inovance 23-bit absolute encoder
      2000-01h: 14101

      # *** Basic control ***
      #
      # Absolute system selection:  def. 0
      # 1:  Absolute position linear mode (encoder retains value on power down)
      2002-02h: 1

      # *** 2003h Terminal input parameters ***
      # Values for DI "function selection" parameters:
      # 0: No definition
      # 1: S-ON
      # 2: Fault reset
      # 14: Positive limit switch
      # 15: Negative limit switch
      # 31: Home switch
      # 34: Emergency stop
      # 38: Touch probe 1
      # 39: Touch probe 2
      #
      # DI1-DI3 function selection
      2003-03h:  0
      2003-05h:  0
      2003-07h:  0

      # *** 2004h Output terminal Parameters ***
      # Values for DO "function selection" parameters:
      # 0: No definition
      # 1: Servo ready
      # 2: Motor rotating
      # 9: Brake output
      # 10: Warning
      # 11: Fault
      # 25: Comparison output
      # 32: STO EDM
      # Values for DO "logic selection" parameters:
      # 0: Normally open
      # 1: Normally closed
      #
      # DO1 function selection:
      # - Brake output
      2004-01h: 9
      # DO2, DO3 function selection:
      # - None
      2004-03h: 0
      2004-05h: 0
      #
      # DO1-DO3 logic selection
      # - 0:  Enabled on DO low
      # - 1:  Enabled on DI high
      2004-02h: 1
      2004-04h: 1
      2004-06h: 1


      # *** Position Control Parameters ***
      #
      # Speed feedforward control selection
      # - 0: No speed feedforward
      # - 1: Internal speed feedforward
      # - 2: 60B1h as speed feedforward
      # - 3: Zero phase control
      # - Use 60B1h as source of speed feedforward signal in CSP mode
      2005-14h: 2

      # *** 2008h Gain Parameters ***
      #
      # Gain switchover condition
      # - 0: Fixed at 1st gain (PS)
      # - 1: Switchover through bit26 of 60FEh
      # - 2: Torque reference too large (PS)
      # - 3: Speed reference too large (PS)
      # - 4: Speed reference change ratio too large (PS)
      # - 5: Speed reference high/low-speed threshold (PS)
      # - 6: Position deviation too large (P)
      # - 7: Position reference available (P)
      # - 8: Positioning unfinished (P)
      # - 9: Actual speed (P)
      # - 10: Position reference existed + Actual speed (P)
      # - No difference between gains in motion and gains when positioning
      2008-0Ah: 0
      #
      # Load inertia ratio
      # - Range 0–12000, default 100
      # - Commented out due to issues getting beta units ready to ship
      # 2008-10h: [150, 300, 700, 490, 900, 450]
      2008-10h: 100
      #
      # Speed feedforward gain:
      # - Range 0-1000; units 0.1%; default 0
      # - Feedforward gain set to minimize following error - max value
      #   produces best results
      2008-14h: 1000
      #
      # Torque feedforward gain
      # - Range 0-2000; units 0.1%;  default 0
      # - High levels of torque feedforward produce gravelly sounds -
      #   more investigation required
      2008-16h: 0

      # *** 2009h Gain auto-tuning parameters ***
      # Gain auto-tuning mode
      # - Default 0, range 0-7
      # - 0: Invalid, gain parameters adjusted manually
      # - 1: Standard gain auto-tuning mode
      # - 2: Positioning mode
      # - 3: Interpolation mode + Inertia auto-tuning
      # - 4: Normal mode + Inertia auto-tuning
      # - 6: Quick positioning mode + Inertia auto-tuning
      # - Use automatic gain tuning so we don't have to worry about
      #   individual gain settings for now
      2009-01h: 1
      #
      # Stiffness level selection 0-31
      # - Default 15, range 0-41
      # - Higher -> stronger gain and quicker response
      2009-02h: [14, 16, 16, 12, 12, 18]
      #
      # Online inertia auto-tuning mode
      # - 0: Online auto-tuning turned off
      # - 1: Online auto-tuning turned on, changing slowly
      # - 2: Online auto-tuning turned on, changing normally
      # - 3: Online auto-tuning turned on, changing quickly
      2009-04h: 0

      # *** Error and Protection Parameter ***
      # Power input phase loss protection
      # 1:  Enable faults and warnings
      # - Enable voltage fluctuation alarm faults and warnings
      200A-01h: 1

      # *** 200Bh Monitoring parameters ***
      # - FIXME Grab some of these parameters after a drive fault

      # *** 200Dh Auxiliary function parameters ***
      #
      # Forced DI/DO selection switch
      # - 0: No operation
      # - 1: Forced DI enabled, forced DO disabled
      # - 2: Forced DI disabled, forced DO enabled
      # - 3: Forced DI and DO enabled
      # - 4: EtherCAT forced DO enabled
      200D-12h: 4

      # *** 200Eh Auxiliary function parameters ***
      #
      # Node address
      # - Normally configured on keypad; noted here FYI
      # 200E-01h:  [0, 1, 2, 3, 4, 5]
      #
      # Save objects written through communication
      # - This gets set in drive init; noted here FYI
      # - 0:  All setting not saved/volatile
      # - 3:  Save everything to EEPROM/non-volatile
      # 200E-02h:  0
      #
      # EtherCAT synchronization error threshold
      # - Unit uS; range 100-4000; default 3000
      200E-21h:  3000

      # *** Standard Device Profile Parameters ***
      #
      # Quick stop mode
      # CSP mode:
      # 3:  Stop at emergency stop torque in 2007-10h; brake & power off
      605A-00h: 3
      #
      # Position window:  (reference units) def. 734
      # - goal position threshold
      6067-00h: 5872
      #
      # Position window time:  0-65535 (ms)
      # - FIXME - better servo tuning should help us narrow this window
      6068-00h: 65535
      #
      # Max Torque
      # - Sets the maximum torque permitted by the servo drive.
      #   This parameter is set based on the setting of 2007-08h.
      # 6072-00h:  ???
      #
      # Home offset:  (ref. units) def. 0
      # - J3 home offset is -90 deg, home arm vertically
      # FIXME
      # load_parameters: unable to set parameters (last param was [/tool_scene_sync/tool_attach_link=flange]): int exceeds XML-RPC limits
      # 607C-00h: [0, 0, 0xf6000001, 0, 0, 0]
      #
      # 6091h Gear Ratio
      # Sichen sets gear ratio to 6000, but we set it to 1 and handle it in HAL
      # Motor revolutions
      6091-01h: 1
      #
      # Shaft revolutions
      6091-02h: 1
      #
      # Homing method
      # 35:  Home on current position
      6098-00h: 35
      #
      # Digital output:  Bit mask
      # - Bits 16, 17, 18 correspond to DO1, DO2, DO3
      # - When high, output may be forced high via 60FE-01h
      # - Also see 200D-12h
      # - Reserve DO1 for brake (may be forced separately)
      60FE-02h: 0x00060000
