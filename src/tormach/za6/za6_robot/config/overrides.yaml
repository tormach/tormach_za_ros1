move_group:
  #disable_capabilities: move_group/MoveGroupCartesianPathService
#  capabilities:
#    - pilz_trajectory_generation/MoveGroupSequenceAction
#    - pilz_trajectory_generation/MoveGroupSequenceService
  manipulator:
    # default_planner_config: RRTstar
#    kinematics_solver: za6_manipulator/IKFastKinematicsPlugin
#    kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
#    kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
    kinematics_solver: bio_ik/BioIKKinematicsPlugin
    solve_type: Distance
    kinematics_solver_search_resolution: 0.005
    kinematics_solver_timeout: 0.5
    mode: gd_c

  manipulator_global:
    kinematics_solver: bio_ik/BioIKKinematicsPlugin
    solve_type: Distance
    kinematics_solver_search_resolution: 0.005
    kinematics_solver_timeout: 0.5
    mode: bio2_memetic
    center_joints_weight: 1.0

  # set large numbers to prevent timeouts
  # when robot moves with a limited velocity scale
  trajectory_execution:
    allowed_execution_duration_scaling: 10000.0
    allowed_goal_duration_margin: 10000.0

robot_description_kinematics:
  manipulator:
    kinematics_solver: bio_ik/BioIKKinematicsPlugin
    solve_type: Distance
    kinematics_solver_search_resolution: 0.005
    kinematics_solver_timeout: 0.5
    mode: gd_c
