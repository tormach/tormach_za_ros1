exclude: >
  (?x)^(
    (?# Do not reformat this auto-generated package )
    src/tormach/za6/za6_moveit_config/.*
    |
    robot_programs/.*
    |
    (?# Do not reformat these auto-generated files )
    src/tormach/za6_manipulator_ikfast_plugin/.*(cpp|h)
    |
    (?# Do not reformat patches )
    .*/.*\.patch
    |
    (?# Do not reformat QElectroTech schematics )
    docs/wiring_diagrams/.*\.qet
    |
    (?# Must be py2 compatible until Sichen updates test controller )
    install_scripts/dio_test/.*\.py
  )$

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-byte-order-marker
      - id: trailing-whitespace
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-xml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: debug-statements
      - id: detect-private-key

-   repo: https://github.com/asottile/pyupgrade
    rev: v3.16.0
    hooks:
    -   id: pyupgrade
        args: [--py37-plus, --keep-runtime-typing]

- repo: local
  hooks:
    -   id: black
        name: Run black code formatter
        description: This hook formats Python code.
        entry: env LC_ALL=C.UTF-8 black -q
        language: system
        args: [-S, -l, "80"]
        types: [python]
        # ignore robot program examples and templates
        exclude: >
            (?x)^(
                src/robot_ui/src/robot_ui/pathpilot/robot/program/templates/.*|
                src/robot_command/examples/programs/.*|
                robot_programs/.*
            )$

    -   id: clang-format
        name: Run clang-format
        description: Clang C/C++ code formatter.
        entry: clang-format -i
        args: [-style=file]
        language: system
        types: [file, c++]
        # note: formatting style in .clang-format

#    -   id: qmllint
#        name: Run qmllint
#        description: QML linter
#        entry: pyside6-qmllint
#        language: system
#        files: ^.*\.qml$

    -   id: qmlformat
        name: Run qmlformat
        description: qmlformat QML code formatter.
        entry: pyside6-qmlformat
        args: [--ignore-settings, --inplace, -w 2] #, --normalize, --objects-spacing, --functions-spacing]
        language: system
        files: ^.*\.qml$

    -   id: shfmt
        name: Run shfmt
        description: shfmt Shell code formatter.
        entry: shfmt -w
        args: [-i=4]
        language: system
        types: [file, shell]

    -   id: xmlindent
        name: Run xmlindent
        description: xmlindent XML code formatter.
        entry: devel_scripts/xmlformat.sh
        args: [-nbe, -i 2]
        language: system
        files: ^.*\.(xml|launch|xacro)$

    -   id: cmake-format
        name: Run cmake-format
        description: cmake-format CMakeLists.txt formatter.
        entry: cmake-format
        args: [-i]
        language: system
        files: ^(.*/CMakeLists\.txt|.*\.cmake)$

    -   id: docker-image-version
        name: Check for current docker image version
        description:  Fail if docker image is out of date and needs bump
        entry: install_scripts/docker-dev.sh -B
        language: system
        files: ^install_scripts/docker/.*$
        require_serial:  true
        verbose:  false

-   repo: https://github.com/PyCQA/flake8
    rev: 7.1.2
    hooks:
      - id: flake8
        args: [--config=.flake8]
